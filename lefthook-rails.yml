pre-push:
  jobs:
    - name: packages audit
      tags:
        - frontend
        - security
      run: NODE_NO_WARNINGS=1 yarn audit-ci --moderate

    - name: gems audit
      tags:
        - backend
        - security
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_QUARANTINE_PATH -u GIT_COMMON_DIR bin/bundler-audit check --update

    - name: brakeman
      tags:
        - security
      run: bin/brakeman -q -w2 > /dev/null

    - name: playwright
      tags:
        - backend
      run: NODE_NO_WARNINGS=1 bin/playwright > /dev/null

    - name: rspec
      tags:
        - backend
      run: bin/rspec

pre-commit:
  parallel: true
  jobs:
    # - run: yarn eslint {staged_files}
    #   glob: "*.{js,ts,jsx,tsx}"

    - name: erblint
      tags:
        - frontend
      glob: "{*.html.erb}"
      run: bin/erb_lint {staged_files} --cache

    - name: rubocop
      tags:
        - backend
      glob: "{*.rb,Gemfile}"
      run: bin/rubocop --force-exclusion {staged_files}

    # - name: db consistency
    #   run: bin/database_consistency -c .database_consistency.todo.yml

deploy:
  jobs:
    - name: trigger hatchbox deploy
      run: |
        HATCHBOX_WEBHOOK_TOKEN=$(bin/rails runner "puts Rails.application.credentials.hatchbox[:webhook_token]")
        
        git fetch origin
        git checkout production || git checkout -b production origin/production
        git reset --hard origin/production
        git merge main
        git push -u origin production
        
        # Verify production and main are now in sync
        MAIN_SHA=$(git rev-parse main)
        PROD_SHA=$(git rev-parse production)
        if [ "$MAIN_SHA" != "$PROD_SHA" ]; then
          echo "Error: Production and main branches are not in sync!"
          echo "Main SHA: $MAIN_SHA"
          echo "Production SHA: $PROD_SHA"
          git checkout -
          exit 1
        fi
        
        git checkout -
        curl -X POST "https://app.hatchbox.io/webhooks/deployments/${HATCHBOX_WEBHOOK_TOKEN}?sha=$(git rev-parse production)"

deploy-commit:
  jobs:
    - name: deploy specific commit to hatchbox
      run: |
        set -eu

        COMMIT_SHA="{1}"

        if [ -z "$COMMIT_SHA" ]; then
          echo "Error: No commit SHA provided"
          echo "Usage: lefthook run deploy-commit -- <commit-sha>"
          exit 1
        fi

        if ! FULL_SHA=$(git rev-parse --verify "${COMMIT_SHA}^{commit}" 2>/dev/null); then
          echo "Error: Commit '$COMMIT_SHA' does not exist"
          exit 1
        fi

        echo "Deploying commit:"
        git --no-pager log -1 --oneline --decorate "$FULL_SHA"

        HATCHBOX_WEBHOOK_TOKEN=$(bin/rails runner "puts Rails.application.credentials.hatchbox[:webhook_token]")
        if [ -z "$HATCHBOX_WEBHOOK_TOKEN" ]; then
          echo "Error: Hatchbox webhook token is missing"
          exit 1
        fi

        echo "Triggering deployment..."
        curl --silent --show-error --fail --max-time 60 -X POST "https://app.hatchbox.io/webhooks/deployments/${HATCHBOX_WEBHOOK_TOKEN}?sha=$FULL_SHA" >/dev/null
        echo "Deployment triggered successfully!"

performance:
  jobs:
    - name: trigger lighthouse performance test
      run: | 
        CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
        git fetch origin
        git checkout performance || git checkout -b performance origin/performance
        git reset --hard origin/performance
        git merge $CURRENT_BRANCH
        git push -u origin performance
        
        # Verify performance and main are now in sync
        MAIN_SHA=$(git rev-parse $CURRENT_BRANCH)
        PERF_SHA=$(git rev-parse performance)
        if [ "$MAIN_SHA" != "$PERF_SHA" ]; then
          echo "Error: Performance and $CURRENT_BRANCH branches are not in sync!"
          echo "$CURRENT_BRANCH SHA: $MAIN_SHA"
          echo "Performance SHA: $PERF_SHA"
          git checkout -
          exit 1
        fi
        
        git checkout -
